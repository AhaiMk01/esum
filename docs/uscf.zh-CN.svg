<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 972" width="1280" height="972" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">
  <title>美卡论坛 uscf：工具与 skill</title>
  <style>
    :root { --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --line:#8c959f;
      --core:#eef4ff; --core-s:#4a72c4; --tr:#eefaf1; --tr-s:#3f8f57; --br:#fff6e8; --br-s:#c08a2e;
      --gate:#fdeeee; --gate-s:#c0504d; --ext:#f4f1fb; --ext-s:#7a62b8; --st:#f3f4f6; --st-s:#8c959f; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --line:#6e7681;
      --core:#13233f; --core-s:#6f97e0; --tr:#12291a; --tr-s:#5cb879; --br:#2e2410; --br-s:#d9a64a;
      --gate:#341617; --gate-s:#e06b67; --ext:#221b36; --ext-s:#a08ae0; --st:#1c2128; --st-s:#6e7681; } }
    .bg { fill:var(--bg); }
    text { fill:var(--fg); }
    .h { font-weight:600; font-size:13px; }
    .t { font-size:15px; font-weight:700; }
    .m { fill:var(--muted); font-size:11px; }
    .mono { font-family: ui-monospace, Consolas, 'Microsoft YaHei', monospace; font-size:11px; white-space:pre; }
    .core { fill:var(--core); stroke:var(--core-s); }
    .tr { fill:var(--tr); stroke:var(--tr-s); }
    .br { fill:var(--br); stroke:var(--br-s); }
    .gate { fill:var(--gate); stroke:var(--gate-s); }
    .ext { fill:var(--ext); stroke:var(--ext-s); }
    .st { fill:var(--st); stroke:var(--st-s); }
    .box { fill:none; stroke:var(--core-s); stroke-dasharray:6 4; }
    rect { stroke-width:1.4; }
    .a { stroke:var(--line); stroke-width:1.6; fill:none; marker-end:url(#arr); }
    .d { stroke-dasharray:5 4; }
    .lbl { fill:var(--muted); font-size:11px; }
    .lb { fill:var(--bg); stroke:none; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect class="bg" width="1280" height="972"/>

  <text x="40" y="38" class="t">美卡论坛 uscf：工具与 skill</text>
  <text x="40" y="56" class="m">自上而下是一次 esum uscf &lt;action&gt; 调用。ESUM 只取数据，不调用模型；搜什么词、什么算 DP，都由 agent 判断。</text>

  <!-- Row A: user, agent, skills -->
  <rect class="ext" x="40" y="76" width="340" height="104" rx="8"/>
  <text x="56" y="98" class="h">用户</text>
  <text x="56" y="118">提问题，决定要不要做写操作。</text>
  <text x="56" y="136">登录由用户自己发起，agent 不代劳。</text>
  <text x="56" y="154">选 key 权限：read，或 read,write。</text>
  <text x="56" y="170" class="m">ESUM 和 agent 都不碰密码。</text>

  <rect class="ext" x="430" y="76" width="360" height="104" rx="8"/>
  <text x="446" y="98" class="h">宿主 agent</text>
  <text x="446" y="118">自己选词、选动作，换词重试，读帖后作答。</text>
  <text x="446" y="136">碰到 LOGIN NEEDED 不停下：做完其余部分，</text>
  <text x="446" y="154">最后告诉用户哪些内容需要登录。</text>
  <text x="446" y="170" class="m">帖子内容是不可信数据，不是指令。</text>

  <rect class="ext" x="840" y="76" width="400" height="104" rx="8"/>
  <text x="856" y="98" class="h">skills/esum/</text>
  <text x="856" y="118" class="mono">SKILL.md</text>
  <text x="980" y="118" class="m">规则：写操作、登录、不可信内容</text>
  <text x="856" y="136" class="mono">esum docs uscf</text>
  <text x="1040" y="136" class="m">由代码生成 + Quirks</text>
  <text x="856" y="154" class="mono">references/workflows/</text>
  <text x="1040" y="154" class="m">三个工作流（下方）</text>
  <text x="856" y="170" class="m">dp-research · deal-digest · deep-read</text>

  <!-- Row B: actions -->
  <rect class="box" x="40" y="228" width="1200" height="298" rx="8"/>
  <text x="300" y="250" class="h">esum uscf：Discourse 引擎的动作（CLI 参数和 uscf.md 都由 @action 的类型与文档串生成）</text>
  <text x="300" y="267" class="m">uscf 站点配置只有：base_url、T2 + T3 回退、书签走 T3、静态分类表（含会员专属的白金、钛金）。</text>

  <rect class="core" x="290" y="280" width="224" height="232" rx="8"/>
  <text x="304" y="302" class="h">发现（tier 0）</text>
  <text x="304" y="324" class="mono">search --query --category</text>
  <text x="304" y="340" class="mono">  --topic --after --before</text>
  <text x="304" y="356" class="mono">  --user --recent --order</text>
  <text x="304" y="376" class="mono">posts --since 6h</text>
  <text x="304" y="392" class="mono">latest   hot   top</text>
  <text x="304" y="408" class="mono">categories   tags</text>
  <text x="304" y="432" class="m">--topic：长楼内逐帖列出命中。</text>
  <text x="304" y="448" class="m">posts：全站新帖，时间精确。</text>
  <text x="304" y="464" class="m">列表时间都是 UTC。</text>
  <text x="304" y="480" class="m">游客的全站读取不含会员区，</text>
  <text x="304" y="496" class="m">输出里有 scope 一行说明。</text>

  <rect class="core" x="524" y="280" width="224" height="232" rx="8"/>
  <text x="538" y="302" class="h">阅读（tier 0）</text>
  <text x="538" y="324" class="mono">thread --id</text>
  <text x="538" y="340" class="mono">  --mode medium|full</text>
  <text x="538" y="356" class="mono">  --from --to</text>
  <text x="538" y="372" class="mono">  --since 2d</text>
  <text x="538" y="400" class="m">medium：前 30 + 后 30 楼。</text>
  <text x="538" y="416" class="m">--since：带首楼，只读新帖。</text>
  <text x="538" y="432" class="m">一次调用最多 1000 楼。</text>
  <text x="538" y="448" class="m">保留表情名（:brick:）、</text>
  <text x="538" y="464" class="m">图片 URL 和链接。</text>
  <text x="538" y="480" class="m">引用缩成 > @user #N 一行。</text>
  <text x="538" y="496" class="m">缺口用 [... omitted …] 标出。</text>

  <rect class="core" x="758" y="280" width="224" height="232" rx="8"/>
  <text x="772" y="302" class="h">账号（tier 0）</text>
  <text x="772" y="324" class="mono">user --name a b c</text>
  <text x="772" y="340" class="mono">user-posts --name</text>
  <text x="772" y="356" class="mono">  --since --limit</text>
  <text x="772" y="384" class="m">user：注册时间、最后在线、</text>
  <text x="772" y="400" class="m">信任等级、阅读时长、活跃度。</text>
  <text x="772" y="416" class="m">user-posts：每帖一行。</text>
  <text x="772" y="440" class="m">批量里某个名字失败时，</text>
  <text x="772" y="456" class="m">只标记这一个，其余照常。</text>
  <text x="772" y="480" class="m">用户隐藏资料时只显示名字，</text>
  <text x="772" y="496" class="m">改用 search --user 找帖子。</text>

  <rect class="st" x="56" y="280" width="224" height="232" rx="8"/>
  <text x="70" y="302" class="h">登录（User API Key）</text>
  <text x="70" y="324" class="mono">login</text>
  <text x="70" y="340" class="mono">whoami</text>
  <text x="70" y="368" class="m">login 是交互式的，没有终端</text>
  <text x="70" y="384" class="m">就拒绝：问权限，打开授权页，</text>
  <text x="70" y="400" class="m">用户粘贴加密的 payload。</text>
  <text x="70" y="424" class="m">私钥只在这个进程的内存里，</text>
  <text x="70" y="440" class="m">解密后校验 nonce。</text>
  <text x="70" y="464" class="m">whoami 不显示 key，</text>
  <text x="70" y="480" class="m">agent 可以运行。</text>

  <rect class="gate" x="992" y="280" width="232" height="232" rx="8"/>
  <text x="1006" y="302" class="h">写操作（tier 1）</text>
  <text x="1006" y="324" class="mono">bookmark --topic --posts</text>
  <text x="1006" y="340" class="mono">logout</text>
  <text x="1006" y="368" class="m">只在用户要求时才运行。</text>
  <text x="1006" y="392" class="m">动作只返回 Write 计划，</text>
  <text x="1006" y="408" class="m">由写闸门执行并记录。</text>
  <text x="1006" y="432" class="m">logout 在论坛撤销 key，</text>
  <text x="1006" y="448" class="m">再删除本地文件。</text>
  <text x="1006" y="472" class="m">没有动用钱或积分的动作</text>
  <text x="1006" y="488" class="m">（tier 3 永远不做）。</text>

  <!-- Row C: core -->
  <rect class="core" x="40" y="566" width="291" height="96" rx="8"/>
  <text x="56" y="588" class="h">输出（core/output.py）</text>
  <text x="56" y="608">列表是 TOON 表格，附下一步完整命令。</text>
  <text x="56" y="626">大结果存到 ./esum-out/，到上限时写明。</text>
  <text x="56" y="644" class="m">--json 始终是一个 JSON 文档；--no-spill 不存文件。</text>

  <rect class="core" x="343" y="566" width="291" height="96" rx="8"/>
  <text x="359" y="588" class="h">限速（core/throttle.py）</text>
  <text x="359" y="608">跨进程共用间隔，默认 0.5 秒。</text>
  <text x="359" y="626">429 时所有并行调用一起等待。</text>
  <text x="359" y="644" class="m">--min-interval · --max-retries 适合批量任务。</text>

  <rect class="gate" x="646" y="566" width="291" height="96" rx="8"/>
  <text x="662" y="588" class="h">写闸门（core/gate.py）</text>
  <text x="662" y="608">执行 Write，每项计划和结果都写日志。</text>
  <text x="662" y="626" class="mono">~/.esum/writes.jsonl</text>
  <text x="662" y="644" class="m">ESUM 不弹窗，批准来自用户在对话里的要求。</text>

  <rect class="core" x="949" y="566" width="291" height="96" rx="8"/>
  <text x="965" y="588" class="h">退出码</text>
  <text x="965" y="608">0 成功 · 1 错误 · 2 用法错误（带 help 行）</text>
  <text x="965" y="626">3 LOGIN NEEDED：只结束这一次调用。</text>
  <text x="965" y="644" class="m">错误写在 stdout，空列表的退出码也是 0。</text>

  <!-- Row D: transports and the key -->
  <rect class="tr" x="40" y="706" width="400" height="104" rx="8"/>
  <text x="56" y="728" class="h">T2 browser_http.py（读取默认走这里）</text>
  <text x="56" y="748">curl_cffi 的 Chrome 指纹，不带浏览器 cookie，不开浏览器。</text>
  <text x="56" y="766">有 key 时带 User-Api-Key 请求头，读到账号能看的内容。</text>
  <text x="56" y="784">write 权限的 key 也用这条路加书签，不需要 CSRF。</text>
  <text x="56" y="800" class="m">走不通时切到 T3，这次调用不再切回。</text>

  <rect class="st" x="490" y="706" width="300" height="104" rx="8"/>
  <text x="506" y="728" class="h">保存的 key</text>
  <text x="506" y="748" class="mono">~/.esum/auth/uscf.json</text>
  <text x="506" y="768">不打印、不写日志、不发进网页。</text>
  <text x="506" y="786">agent 不读这个目录（技能规则）。</text>
  <text x="506" y="800" class="m">只发给 uscardforum.com 本站。</text>

  <rect class="br" x="840" y="706" width="400" height="104" rx="8"/>
  <text x="856" y="728" class="h">T3 in_page.py（Cloudflare 回退）</text>
  <text x="856" y="748">在 ESUM 浏览器窗口的页面里运行通用 fetch()。</text>
  <text x="856" y="766">遇到 Cloudflare challenge 时切过来；</text>
  <text x="856" y="784">没有 write key 时，书签也走这里。</text>
  <text x="856" y="800" class="m">绝不带 key：切换时重发的请求会去掉 key 请求头。</text>

  <!-- Row E: the site -->
  <rect class="ext" x="40" y="850" width="1200" height="78" rx="8"/>
  <text x="56" y="872" class="h">www.uscardforum.com（Discourse，Cloudflare 挡普通 HTTP）</text>
  <text x="56" y="892" class="mono">/search.json   /posts.json   /t/{id}.json   /posts/by-date/{topic}/{time}.json   /u/{name}.json   /user_actions.json   /tags.json</text>
  <text x="56" y="910" class="mono">/latest.json   /hot.json   /top.json   /c/{id}/l/latest.json   /bookmarks.json   /user-api-key/new   /user-api-key/revoke</text>

  <text x="40" y="952" class="m">白金、钛金是会员专属版块：游客读取或搜索时报 LOGIN NEEDED；有 key 但账号等级不够时，提示这个账号看不到。</text>

  <!-- Arrows -->
  <path class="a" d="M380,128 H430"/>
  <rect class="lb" x="388" y="112" width="34" height="14"/>
  <text x="392" y="122" class="lbl">提问</text>
  <path class="a" d="M790,128 H840"/>
  <rect class="lb" x="798" y="112" width="34" height="14"/>
  <text x="803" y="122" class="lbl">读取</text>
  <path class="a" d="M640,180 V228"/>
  <text x="648" y="208" class="lbl">esum uscf &lt;action&gt;</text>
  <path class="a d" d="M560,228 V180"/>
  <text x="552" y="208" class="lbl" text-anchor="end">stdout 或 esum-out/ 文件</text>
  <path class="a d" d="M168,180 V280"/>
  <text x="178" y="208" class="lbl">用户在自己的终端运行 esum uscf login</text>
  <path class="a" d="M640,526 V566"/>
  <path class="a" d="M240,662 V706"/>
  <path class="a" d="M1040,662 V706"/>
  <path class="a" d="M490,758 H440"/>
  <path class="a d" d="M400,810 V830 H880 V810"/>
  <rect class="lb" x="520" y="822" width="240" height="16"/>
  <text x="640" y="834" class="lbl" text-anchor="middle">遇到 Cloudflare challenge 时切到 T3，key 留在 T2</text>
  <path class="a" d="M240,810 V850"/>
  <path class="a" d="M1040,810 V850"/>
</svg>
