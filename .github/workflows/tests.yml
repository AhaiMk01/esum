name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    name: offline tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      # the offline suite: no network (a guard fails any test that opens a socket), no browser
      - run: uv run pytest -n auto -q
